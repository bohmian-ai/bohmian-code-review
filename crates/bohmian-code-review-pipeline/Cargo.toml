[package]
name = "bohmian-code-review-pipeline"
description = "GitHub/GHES source access, verified Git identities, and injected storage/persistence contracts for the review-context pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bohmian-code-review.workspace = true
flate2.workspace = true
getrandom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[features]
# In-memory adapters and a routed fake transport for journeys outside the crate.
testing = ["tokio/rt"]

[dev-dependencies]
tar.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true

[[test]]
name = "pipeline_journey"
required-features = ["testing"]

[[example]]
name = "live_pr"
required-features = ["testing"]

[[example]]
name = "context_relevance"
required-features = ["testing"]
test = true
